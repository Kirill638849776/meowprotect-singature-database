name: Auto-reject admin PRs

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  reject:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      
    steps:
      - name: Check PR title and body for admin keywords
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Приводим к нижнему регистру
          TITLE_LOWER=$(echo "$PR_TITLE" | tr '[:upper:]' '[:lower:]')
          BODY_LOWER=$(echo "$PR_BODY" | tr '[:upper:]' '[:lower:]')
          
          echo "📌 Заголовок: $PR_TITLE"
          echo "📝 Тело: ${PR_BODY:-<пусто>}"
          
          # Проверяем наличие подозрительных слов
          if echo "$TITLE_LOWER" | grep -q "админ\|admin\|owner\|права\|доступ" || \
             echo "$BODY_LOWER" | grep -q "админ\|admin\|owner\|права\|доступ"; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "🔴 Найдены подозрительные слова"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "✅ Подозрительных слов нет"
          fi
      
      - name: Reject PR
        if: steps.check.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log(`🚫 Отклоняем PR #${prNumber}`);
            
            // Добавляем метку "отказ" (создаём, если её нет)
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['отказ']
              });
            } catch (error) {
              // Если метки нет, создаём её
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: 'отказ',
                  color: 'B60205',
                  description: 'Автоматический отказ'
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: ['отказ']
                });
              } else {
                throw error;
              }
            }
            
            // Добавляем комментарий
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `❌ **Автоматический отказ**
              
Ваш Pull Request содержит подозрительные слова (админ/admin/owner/права/доступ).
Изменение прав доступа через PR невозможно.

Пожалуйста, создайте новый PR без этих слов, если у вас есть реальное изменение кода.`
            });
            
            // Закрываем PR
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: prNumber,
              state: 'closed'
            });
            
            console.log(`✅ PR #${prNumber} отклонён`);
      
      - name: PR is safe
        if: steps.check.outputs.found == 'false'
        run: |
          echo "✅ PR прошел проверку, подозрительных слов не найдено"
