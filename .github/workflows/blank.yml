name: Auto-reject admin PRs

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  reject:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      
    steps:
      - name: Check and reject if contains admin keywords
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const body = (pr.body || '').toLowerCase();
            
            console.log(`📌 Проверяем PR #${pr.number}`);
            console.log(`📝 Заголовок: ${title}`);
            console.log(`📄 Тело: ${body.substring(0, 100)}...`);
            
            // Проверяем наличие подозрительных слов
            const keywords = ['админ', 'admin', 'owner', 'права', 'доступ'];
            const found = keywords.some(word => 
              title.includes(word) || body.includes(word)
            );
            
            if (found) {
              console.log('🔴 Найдены подозрительные слова');
              
              // Добавляем метку "отказ"
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['отказ']
              });
              
              // Добавляем комментарий
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '❌ **Автоматический отказ**\n\nВаш Pull Request содержит подозрительные слова (админ/admin/owner/права/доступ).\nИзменение прав доступа через PR невозможно.\n\nПожалуйста, создайте новый PR без этих слов.'
              });
              
              // Закрываем PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
              
              console.log(`✅ PR #${pr.number} отклонён`);
            } else {
              console.log('✅ Подозрительных слов не найдено');
            }
