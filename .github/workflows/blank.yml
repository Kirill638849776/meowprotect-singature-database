name: Check and require manual review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      
    steps:
      - name: Check PR and add comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            // Проверяем, есть ли уже комментарий от бота
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            
            const botComment = comments.data.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('✅ Автоматическая проверка пройдена')
            );
            
            // Если комментарий уже есть — не дублируем
            if (botComment) {
              console.log('ℹ️ Комментарий уже добавлен');
              return;
            }
            
            // Добавляем комментарий
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `✅ **Автоматическая проверка пройдена**
            
🔍 **Результат:** PR прошёл базовую проверку.

👀 **Теперь требуется ручная проверка** от мейнтейнера.

@Kirill638849776, пожалуйста, проверьте этот PR и примите решение.`
            });
            
            console.log(`✅ Комментарий добавлен в PR #${pr.number}`);
