name: Reject admin PRs

on:
  pull_request:
    types: [opened, edited]

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - name: Check and reject PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}  # ← Убедитесь, что имя совпадает
          script: |
            const pr = context.payload.pull_request;
            const title = (pr.title || '').toLowerCase();
            const body = (pr.body || '').toLowerCase();

            const badWords = ['админ', 'admin', 'owner', 'права', 'доступ'];
            const hasBadWord = badWords.some(w => title.includes(w) || body.includes(w));

            if (!hasBadWord) {
              console.log('✅ Подозрительных слов не найдено');
              return;
            }

            console.log('🔴 Найдены подозрительные слова, отклоняем PR');

            // Добавляем метку "отказ"
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['отказ']
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'отказ',
                  color: 'B60205'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['отказ']
                });
              } else {
                console.warn('⚠️ Не удалось добавить метку:', error.message);
              }
            }

            // Добавляем комментарий
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '❌ **Автоматический отказ**\n\nВаш Pull Request содержит подозрительные слова (админ/admin/owner/права/доступ).\nИзменение прав доступа через PR невозможно.\n\nПожалуйста, создайте новый PR без этих слов.'
            });

            // Закрываем PR
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });

            console.log(`✅ PR #${pr.number} успешно отклонен`);
