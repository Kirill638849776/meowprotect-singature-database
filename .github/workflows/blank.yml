name: Auto-reject admin PRs

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-and-reject:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      
    steps:
      - name: Check for admin keywords
        id: check
        run: |
          # Получаем заголовок и тело PR
          TITLE="${{ github.event.pull_request.title }}"
          BODY="${{ github.event.pull_request.body }}"
          
          # Приводим к нижнему регистру для поиска
          TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
          BODY_LOWER=$(echo "$BODY" | tr '[:upper:]' '[:lower:]')
          
          # Проверяем наличие слов "админ" или "admin"
          if echo "$TITLE_LOWER" | grep -q "админ\|admin" || echo "$BODY_LOWER" | grep -q "админ\|admin"; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "🔴 Обнаружено подозрительное слово: админ/admin" >> $GITHUB_STEP_SUMMARY
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "✅ Подозрительных слов не найдено" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Add rejection label and close PR
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Добавляем метку "отказ"
          gh pr edit $PR_NUMBER --add-label "отказ"
          
          # Добавляем комментарий с объяснением
          gh pr comment $PR_NUMBER --body "❌ **Автоматический отказ**  
          
          Ваш Pull Request содержит подозрительные слова (админ/admin).  
          Изменение прав доступа через PR невозможно.  
          
          Пожалуйста, создайте новый PR без этих слов, если у вас есть реальное изменение кода."
          
          # Закрываем PR
          gh pr close $PR_NUMBER --comment "PR закрыт автоматически из-за подозрительного содержимого"
          
      - name: Success message (if no admin words found)
        if: steps.check.outputs.found == 'false'
        run: |
          echo "✅ PR прошел проверку, подозрительных слов не найдено"
