name: Auto-reject admin PRs

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-and-reject:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
      
    steps:
      - name: Check for admin keywords in PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Получаем данные PR через GitHub CLI
          PR_DATA=$(gh pr view $PR_NUMBER --json title,body)
          
          # Извлекаем заголовок и тело
          TITLE=$(echo "$PR_DATA" | jq -r '.title')
          BODY=$(echo "$PR_DATA" | jq -r '.body // ""')
          
          # Приводим к нижнему регистру
          TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
          BODY_LOWER=$(echo "$BODY" | tr '[:upper:]' '[:lower:]')
          
          # Проверяем наличие ключевых слов
          if echo "$TITLE_LOWER" | grep -q "админ\|admin\|owner\|права\|доступ" || \
             echo "$BODY_LOWER" | grep -q "админ\|admin\|owner\|права\|доступ"; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "🔴 Обнаружено подозрительное слово" >> $GITHUB_STEP_SUMMARY
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "✅ Подозрительных слов не найдено" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Reject PR (add label, comment, close)
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "🚫 Отклоняем PR #$PR_NUMBER"
          
          # Добавляем метку "отказ" (создаём, если её нет)
          gh label create "отказ" --repo $REPO --description "Автоматический отказ" 2>/dev/null || true
          gh pr edit $PR_NUMBER --add-label "отказ"
          
          # Добавляем комментарий с объяснением
          gh pr comment $PR_NUMBER --body "❌ **Автоматический отказ**  
          
          Ваш Pull Request содержит подозрительные слова (админ/admin/owner/права/доступ).  
          Изменение прав доступа через PR невозможно.  
          
          Пожалуйста, создайте новый PR без этих слов, если у вас есть реальное изменение кода."
          
          # Закрываем PR
          gh pr close $PR_NUMBER --comment "PR закрыт автоматически из-за подозрительного содержимого"
          
          echo "✅ PR #$PR_NUMBER отклонён"
      
      - name: PR is safe
        if: steps.check.outputs.found == 'false'
        run: |
          echo "✅ PR прошел проверку, подозрительных слов не найдено"
